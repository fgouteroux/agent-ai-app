name: Docker base image digest check

# Dockerfile pins grafana/grafana by both tag and digest (reproducible
# builds -- a tag alone can point at different content over time). This
# doesn't rewrite the Dockerfile automatically: a silent auto-update would
# undermine the whole point of pinning (a change without review). Instead
# it fails loudly when the tag's live digest has drifted from what's
# pinned, so a human bumps both together in a real, reviewed PR.
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - Dockerfile
  workflow_dispatch:

jobs:
  check-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare pinned digest against the tag's current digest
        run: |
          set -euo pipefail
          line=$(grep -m1 '^FROM ' Dockerfile)
          image_and_tag=$(echo "$line" | awk '{print $2}' | cut -d'@' -f1)
          pinned_digest=$(echo "$line" | grep -o 'sha256:[a-f0-9]*' || true)

          if [ -z "$pinned_digest" ]; then
            echo "::error::Dockerfile's FROM line has no @sha256:... digest pinned -- see L2 in the security roadmap."
            exit 1
          fi

          current_digest=$(docker buildx imagetools inspect "$image_and_tag" 2>/dev/null | grep "^Digest:" | awk '{print $2}' || true)

          if [ -z "$current_digest" ]; then
            echo "::warning::Could not resolve $image_and_tag's current digest (registry lookup failed) -- skipping comparison this run."
            exit 0
          fi

          if [ "$pinned_digest" != "$current_digest" ]; then
            echo "::error::Dockerfile pins $image_and_tag@$pinned_digest, but the tag now resolves to $current_digest. Update the Dockerfile's digest in a reviewed PR."
            exit 1
          fi

          echo "Pinned digest matches $image_and_tag's current digest."
