name: Develop PR Policy

on:
  pull_request_target:
    branches: ["develop"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: develop-pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check changed files
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const restrictedPatterns = [
              {
                name: 'GitHub Actions workflows',
                pattern: /^\.github\/workflows\//,
                reason: 'workflow changes need owner review in a trusted branch',
              },
              {
                name: 'generated plugin output',
                pattern: /^dist\//,
                reason: 'dist must be generated by CI, not committed by contributors',
              },
              {
                name: 'archives and binary artifacts',
                pattern: /\.(zip|tar|tar\.gz|tgz|rar|7z|exe|dll|so|dylib|apk|deb|rpm|msi|jar|war|class|wasm)$/i,
                reason: 'binary artifacts are not reviewable in normal PR flow',
              },
              {
                name: 'sensitive file names',
                pattern: /(^|\/)(\.env($|\.)|id_rsa|id_dsa|id_ecdsa|id_ed25519|.*\.(pem|key|p12|pfx|crt|cer))$/i,
                reason: 'secrets and private keys must never be committed',
              },
            ];

            const violations = [];
            for (const file of files) {
              for (const rule of restrictedPatterns) {
                if (rule.pattern.test(file.filename) && !file.filename.endsWith('.env.example')) {
                  violations.push(`${file.filename} (${rule.name}: ${rule.reason})`);
                }
              }
            }

            if (violations.length > 0) {
              core.setFailed([
                'This PR changes files that are blocked for untrusted develop PRs:',
                ...violations.map((item) => `- ${item}`),
              ].join('\n'));
            }

      - name: Manual run notice
        if: github.event_name != 'pull_request_target'
        run: echo "Policy checks are enforced on pull_request_target events targeting develop."
