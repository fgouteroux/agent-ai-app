apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: agent-ai-app
type: Opaque
stringData:
  password: "REPLACE_ME_WITH_A_REAL_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-plugin-config
  namespace: agent-ai-app
stringData:
  agent-ai-app.yaml: |
    apiVersion: 1
    apps:
      - type: agent-ai-app
        org_id: 1
        disabled: false
        jsonData:
          # Groq has a usable free tier for this model -- get a key at
          # console.groq.com/keys. Swap both fields for OpenAI, an
          # Anthropic-compatible gateway, or any other OpenAI-compatible
          # endpoint if you prefer.
          endpointURL: "https://api.groq.com/openai/v1"
          model: "llama-3.3-70b-versatile"
          timeoutSeconds: 60
          maxTokens: 4096
          maxContextTokens: 120000
          grafanaTokenPath: "/var/run/secrets/grafana-sa/token"
        secureJsonData:
          apiKey: "REPLACE_ME_WITH_YOUR_API_KEY"
